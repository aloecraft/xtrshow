name: Tests

# Reusable suite, called by CI/CD and by Publish to PyPI. Kept in one place
# so the matrix that gates a release is always the matrix that gates a pull
# request; two copies would drift and the release gate would quietly become
# weaker than the one developers see. See doc/ALIGNMENT.md, section 9.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run tests
        run: pytest tests/
